  <!-- Light is the default; only a stored dark choice changes anything, and it
       must land before first paint. --bg is read from the stylesheet above so
       the palette stays defined in exactly one place. -->
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'dark') return;
      document.documentElement.setAttribute('data-theme', 'dark');
      var m = document.querySelector('meta[name="theme-color"]');
      var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      if (m && bg) m.setAttribute('content', bg);
    })();
  </script>

<script>
(async () => {
  let data;
  try {
    const res = await fetch('/data.json');
    data = await res.json();
  } catch {
    document.getElementById('home-content').innerHTML =
      '<p style="color:var(--muted);font-size:.9rem">Failed to load content.</p>';
    return;
  }

  const { meta, now, about } = data;
  const container = document.getElementById('home-content');

  container.innerHTML = `
    <div class="fade-up">
      <h1 class="home-name">${meta.name}</h1>
      <p class="home-tagline">${meta.tagline}</p>
    </div>

    <section class="fade-up">
      <div class="now-block">
        <figure class="profile-photo">
          <img src="/images/aswin-pradeep-c-profile-pic.jpg" alt="Aswin Pradeep C" width="148" height="148" loading="lazy" decoding="async" />
          <figcaption>Aswin Pradeep C in 2026</figcaption>
        </figure>
        <p>${now}</p>
      </div>
    </section>

    <section class="fade-up">
      <span class="section-label">About</span>
      <div class="about-block">
        ${about.map(p => `<p>${p}</p>`).join('')}
      </div>
    </section>
  `;
})();
</script>
