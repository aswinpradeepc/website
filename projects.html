<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — Aswin Pradeep C</title>
  <meta name="description" content="Picnix, an agentic day-trip planner built on LangGraph; LLMSearch for financial documents; PitchMailer for job outreach; and devb.io, top 10 at FOSS Hack 2025." />
  <meta name="author" content="Aswin Pradeep C" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://aswinpradeepc.com/projects" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://aswinpradeepc.com/projects.html" />
  <meta property="og:title" content="Projects — Aswin Pradeep C" />
  <meta property="og:description" content="Picnix, an agentic day-trip planner built on LangGraph; LLMSearch for financial documents; PitchMailer for job outreach; and devb.io, top 10 at FOSS Hack 2025." />
  <meta property="og:site_name" content="Aswin Pradeep C" />
  <meta property="og:image" content="https://aswinpradeepc.com/images/aswin-pradeep-c-profile-pic.jpg" />
  <meta property="og:image:alt" content="Aswin Pradeep C" />
  <meta property="og:image:width" content="1100" />
  <meta property="og:image:height" content="1100" />
  <meta property="og:image:type" content="image/jpeg" />
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:site" content="@aswinpradeepc" />
  <meta name="twitter:title" content="Projects — Aswin Pradeep C" />
  <meta name="twitter:description" content="Picnix, an agentic day-trip planner built on LangGraph; LLMSearch for financial documents; PitchMailer for job outreach; and devb.io, top 10 at FOSS Hack 2025." />
  <meta name="twitter:image" content="https://aswinpradeepc.com/images/aswin-pradeep-c-profile-pic.jpg" />
  
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/style.css" />
  <!-- Light is the default; only a stored dark choice changes anything, and it
       must land before first paint. --bg is read from the stylesheet above so
       the palette stays defined in exactly one place. -->
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'dark') return;
      document.documentElement.setAttribute('data-theme', 'dark');
      var m = document.querySelector('meta[name="theme-color"]');
      var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      if (m && bg) m.setAttribute('content', bg);
    })();
  </script>
  
  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Aswin Pradeep C",
    "jobTitle": "Backend Developer",
    "url": "https://aswinpradeepc.com",
    "image": "https://aswinpradeepc.com/images/aswin-pradeep-c.jpg",
    "sameAs": [
      "https://github.com/aswinpradeepc",
      "https://linkedin.com/in/aswinpradeepc"
    ]
  }
  </script>
</head>
<body>

<nav id="nav"></nav>

<main>
  <div id="projects-content"></div>
</main>

<footer id="footer"></footer>

<script src="/nav.js"></script>
<script src="/footer.js"></script>
<script>
(async () => {
  let data;
  try {
    const res = await fetch('/data.json');
    data = await res.json();
  } catch {
    document.getElementById('projects-content').innerHTML =
      '<p style="color:var(--muted);font-size:.9rem">Failed to load content.</p>';
    return;
  }

  const { projects, moreProjects, opensource, meta } = data;
  const container = document.getElementById('projects-content');

  const projectItems = projects.map(p => {
    const links = [
      p.github ? `<a class="subtle" href="${p.github}" target="_blank" rel="noopener">GitHub ↗</a>` : '',
      p.live   ? `<a class="subtle" href="${p.live}"   target="_blank" rel="noopener">Live ↗</a>`   : '',
    ].filter(Boolean).join('');
    const tags = p.tech.map(t => `<span class="tag">${t}</span>`).join('');
    return `
      <div class="project-item fade-up">
        <div class="project-name-row">
          <span class="project-name">${p.name}</span>
          ${links}
        </div>
        <p class="project-desc">${p.desc}</p>
        <div class="tags">${tags}</div>
      </div>
    `;
  }).join('');

  const moreItems = (moreProjects || []).map(p => {
    const tags = p.tech.map(t => `<span class="tag">${t}</span>`).join('');
    return `
      <a class="project-card fade-up" href="${p.github}" target="_blank" rel="noopener">
        <div class="project-name-row">
          <span class="project-name">${p.name}</span>
          <span class="card-arrow">GitHub ↗</span>
        </div>
        <p class="project-desc">${p.desc}</p>
        <div class="tags">${tags}</div>
      </a>
    `;
  }).join('');

  const ossItems = opensource.map(o => {
    let imageHtml = '';
    if (o.image) {
      const altText = o.alt || `${o.project} - ${o.desc}`;
      imageHtml = `
        <div class="event-image">
          <img src="${o.image}" alt="${altText}" loading="lazy" />
        </div>
      `;
    }

    return `
      <div class="oss-item fade-up">
        <div class="oss-name">${o.project}</div>
        <p class="oss-desc">${o.desc}</p>
        <div class="oss-links">
          <a class="subtle" href="${o.url}"     target="_blank" rel="noopener">Repository ↗</a>
          <a class="subtle" href="${o.profile}" target="_blank" rel="noopener">My profile ↗</a>
        </div>
        ${imageHtml}
      </div>
    `;
  }).join('');

  container.innerHTML = `
    <div class="fade-up">
      <span class="page-label">Aswin Pradeep C</span>
      <h1 class="page-title">Projects</h1>
    </div>

    <section>
      <span class="section-label">Selected work</span>
      ${projectItems}
    </section>

    <hr class="divider">

    <section>
      <span class="section-label">Open Source</span>
      ${ossItems}
    </section>

    <hr class="divider">

    <section>
      <span class="section-label">More projects</span>
      <div class="project-grid">${moreItems}</div>
      <p style="margin-top:1.5rem;font-size:.8rem;color:var(--muted);">
        More on <a class="subtle" href="${meta.links.github}" target="_blank" rel="noopener">GitHub ↗</a>
      </p>
    </section>
  `;
})();
</script>
</body>
</html>
