  <link rel="stylesheet" href="/style.css" />
  <!-- Light is the default; only a stored dark choice changes anything, and it
       must land before first paint. --bg is read from the stylesheet above so
       the palette stays defined in exactly one place. -->
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'dark') return;
      document.documentElement.setAttribute('data-theme', 'dark');
      var m = document.querySelector('meta[name="theme-color"]');
      var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      if (m && bg) m.setAttribute('content', bg);
    })();
  </script>
  
  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">

<body>

<nav id="nav"></nav>

<main>
  <div id="activities-content"></div>
</main>

<footer id="footer"></footer>

<script src="/nav.js"></script>
<script src="/footer.js"></script>
<script>
(async () => {
  let data;
  try {
    const res = await fetch('/data.json');
    data = await res.json();
  } catch {
    document.getElementById('activities-content').innerHTML =
      '<p style="color:var(--muted);font-size:.9rem">Failed to load content.</p>';
    return;
  }

  const { activities } = data;
  const container = document.getElementById('activities-content');

  // Helper function to render activity items
  const renderItems = (items) => {
    return items.map(e => {
      const tags = e.tags.map(t => `<span class="tag">${t}</span>`).join('');

      let imageHtml = '';
      if (e.image) {
        const altText = e.alt || `Aswin Pradeep C - ${e.title} ${e.subtitle}`;
        imageHtml = `
          <div class="event-image">
            <img src="${e.image}" alt="${altText}" loading="lazy" />
          </div>
        `;
      }

      let linkHtml = '';
      if (e.link) {
        linkHtml = `
          <div style="margin-top: 0.5rem;">
            <a class="subtle" href="${e.link}" target="_blank" rel="noopener">View details ↗</a>
          </div>
        `;
      }

      // Optional, like image and link — without this a missing subtitle
      // renders the literal string "undefined".
      const subtitleHtml = e.subtitle
        ? `<div class="event-subtitle">${e.subtitle}</div>`
        : '';

      return `
        <div class="event-item fade-up">
          <div class="event-header">
            <span class="event-title">${e.title}</span>
            <span class="event-date">${e.date}</span>
          </div>
          ${subtitleHtml}
          <p class="event-desc">${e.description}</p>
          <div class="tags">${tags}</div>
          ${imageHtml}
          ${linkHtml}
        </div>
      `;
    }).join('');
  };

  const communityItems = renderItems(activities.community);
  const achievementItems = renderItems(activities.achievements);

  container.innerHTML = `
    <div class="page-head fade-up">
      <div>
        <span class="page-label">Aswin Pradeep C</span>
        <h1 class="page-title">Activities</h1>
      </div>
      <a class="worth-link" href="/worth-your-time">some stuff worth your time &#8594;</a>
    </div>

    <section>
      <span class="section-label">Community</span>
      ${communityItems}
    </section>

    <hr class="divider">

    <section>
      <span class="section-label">Achievements</span>
      ${achievementItems}
    </section>
  `;
})();
</script>
</body>
</html>
